    <script>
      // 스크롤 복원 정책
      // - 해시 없는 재방문/새로고침: 브라우저 복원을 막고 항상 최상단(Hero)에서 시작

      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (!location.hash) window.scrollTo(0, 0);
    </script>

  <body>
    <!-- Scroll progress indicator -->
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <div id="root"></div>

    <!-- Netlify Forms 등록용 정적 폼 (빌드 시 Netlify가 감지). 실제 전송은 lib/leads.ts에서 같은 필드명으로 POST -->
    <form name="resource-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="solution" />

      <input type="text" name="consent" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/index.tsx"></script>

    <!-- Global scroll-progress + reveal observer -->
    <script>
      // Scroll progress
      const bar = document.getElementById('scrollProgress');
      function updateScrollProgress() {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
        if (bar) bar.style.width = pct + '%';
      }
      window.addEventListener('scroll', updateScrollProgress, { passive: true });
      window.addEventListener('resize', updateScrollProgress);

      // Global IntersectionObserver for .reveal elements (re-scans for React renders)
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      function rescanReveals() {
        document.querySelectorAll('.reveal:not(.is-visible)').forEach(el => revealObserver.observe(el));
      }
      new MutationObserver(rescanReveals).observe(document.body, { childList: true, subtree: true });
      setTimeout(rescanReveals, 200);
      setTimeout(rescanReveals, 1000);

      // 해시 직접 진입: React 렌더 후 해당 섹션으로 이동 (제품 모달 해시는 Platforms가 처리)
      if (location.hash && !location.hash.startsWith('#product-')) {
        const target = location.hash;
        let tries = 0;
        const jump = () => {
          const el = document.querySelector(target);
          if (el) {
            el.scrollIntoView({ block: 'start' });
            // 폰트·poster 로드로 레이아웃이 바뀐 뒤 한 번 더 보정
            setTimeout(() => el.scrollIntoView({ block: 'start' }), 900);
            return;
          }
          if (++tries < 20) setTimeout(jump, 100);
        };
        setTimeout(jump, 150);
      }
    </script>
